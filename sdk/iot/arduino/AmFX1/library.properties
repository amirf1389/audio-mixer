sentence=Control the AmF X1 mixing console over Wi-Fi or Ethernet: faders, mute, solo, pan, master, meters and scenes.
paragraph=Build hardware controllers for AmF X1: pots and motor faders, mute buttons with LEDs, rotary encoders, LED meters and tally lights. Pairs with the console's PIN, keeps live state and meters over a WebSocket (HTTP polling on small boards), no other library needed. Works with any Arduino Client (ESP32, ESP8266, WiFiNINA, Ethernet).
