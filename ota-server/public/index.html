<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Mixer — Download</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b0e14;--panel:#121722;--panel2:#171d2b;--line:#252d3f;--text:#e6e9f0;--dim:#8b95ab;--amber:#fbbf24;--cyan:#22d3ee;--green:#34d399;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f9;--panel:#fff;--panel2:#f6f8fc;--line:#d8deea;--text:#161b27;--dim:#5b6579;--amber:#b45309;--cyan:#0e7490;--green:#047857}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font:800 15px var(--mono);letter-spacing:.14em;text-transform:uppercase}
h1 b{color:var(--amber)}
h2{margin:0 0 10px;font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
main{max-width:720px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
#others-card,#driver-card,#notes-card{text-align:left}
.btn{display:inline-block;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 16px;border-radius:7px;cursor:pointer;font:700 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--amber);color:#111;border-color:var(--amber);font-size:14px;padding:12px 24px}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid a.btn{text-align:center}
ul{margin:0;padding-left:20px}
li{margin:4px 0}
.center{text-align:center}
[hidden]{display:none!important}
@media (max-width:560px){main{padding:10px}}
</style>
</head>
<body>
<header>
  <h1>AUDIO <b>MIXER</b></h1>
  <a class="btn" id="src-link" href="/update.json" target="_blank" rel="noopener">update.json</a>
</header>
<main>
  <section class="card" id="hero">
    <p class="dim mono" id="status">Looking up the latest release…</p>
    <h2 id="version-line" hidden></h2>
    <a class="btn primary" id="dl-primary" href="/latest">Download for your system</a>
    <p class="dim" id="detected-note"></p>
  </section>
  <section class="card" id="others-card" hidden>
    <h2>OTHER SYSTEMS</h2>
    <div class="grid" id="others-grid"></div>
  </section>
  <section class="card" id="driver-card" hidden>
    <h2>SYSTEM DRIVER</h2>
    <p class="dim" id="driver-note"></p>
    <a class="btn" id="driver-link" href="/driver">Download the driver</a>
  </section>
  <section class="card" id="notes-card" hidden>
    <h2>RELEASE NOTES</h2>
    <ul id="notes-list"></ul>
  </section>
  <section class="card" id="none-card" hidden>
    <p class="dim">No release is published on this server yet.</p>
  </section>
</main>
<noscript><p class="dim center">This page works without JavaScript too: the DOWNLOAD button above already sends you to the right file for your system.</p></noscript>
<script>
'use strict';
// The primary DOWNLOAD button already works without this script (plain href="/latest", server-side OS detection). This only fills in what the
// server detected, the other systems, the driver and the release notes, from the same JSON the app itself uses (GET /api/latest).
// Server data (labels, release notes, file names) is only ever written as text nodes, no HTML is ever parsed: the same rule as the admin dashboard.
(async function () {
  const $ = id => document.getElementById(id);
  const h = (tag, attrs, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) { if (k === 'class') e.className = v; else if (v !== false && v != null) e.setAttribute(k, v); }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
    return e;
  };
  const human = n => { if (!(n > 0)) return ''; const u = ['B', 'KB', 'MB', 'GB']; let i = 0, v = n; while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; } return (i ? v.toFixed(1) : v) + ' ' + u[i]; };

  let r;
  try { r = await fetch('/api/latest', { cache: 'no-store' }); } catch (e) { $('status').textContent = 'Could not reach the download server. Try again in a moment.'; return; }
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || !j.ok) {
    $('status').textContent = (j && j.error) || 'No release is published on this server yet.';
    $('dl-primary').hidden = true;
    $('none-card').hidden = false;
    return;
  }

  $('status').textContent = 'The latest release:';
  $('version-line').hidden = false;
  $('version-line').textContent = 'Audio Mixer ' + j.version + (j.released ? ' · ' + j.released : '');

  const primary = $('dl-primary');
  if (j.file) {
    primary.textContent = 'Download — ' + j.file.label + (j.file.size ? ' (' + human(j.file.size) + ')' : '');
    primary.title = j.file.how || '';
    $('detected-note').textContent = j.detected ? 'Detected from your browser (' + j.detected + '): ' + (j.os || 'unknown system') + (j.arch ? ', ' + j.arch : '') + '. Not you? Pick a system below.' : '';
  } else {
    primary.hidden = true;
    $('detected-note').textContent = 'Your system (' + (j.os || 'unknown') + ') could not be matched to a published file automatically: pick one below.';
  }

  const others = j.others || [];   // already excludes the picked file and the driver (bridge/osdetect.js)
  if (others.length) {
    $('others-card').hidden = false;
    $('others-grid').replaceChildren(...others.map(o => h('a', { class: 'btn', href: o.url }, o.label + (o.size ? ' (' + human(o.size) + ')' : ''))));
  }

  if (j.driver) {
    $('driver-card').hidden = false;
    $('driver-note').textContent = j.driver.label + (j.driver.how ? ': ' + j.driver.how : '');
  }

  if (j.notes && j.notes.length) {
    $('notes-card').hidden = false;
    $('notes-list').replaceChildren(...j.notes.map(n => h('li', null, n)));
  }
})();
</script>
</body>
</html>
