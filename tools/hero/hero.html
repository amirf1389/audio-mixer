<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "InterD"; src: url(/fonts/InterDisplay-Bold.otf); font-weight: 700; }
@font-face { font-family: "InterL"; src: url(/fonts/Inter-Light.otf); font-weight: 300; }
@font-face { font-family: "InterM"; src: url(/fonts/InterDisplay-Medium.otf); font-weight: 500; }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas#gl { position: absolute; left: 0; top: 0; }
.ov { position: absolute; left: 0; right: 0; text-align: center; color: #f1f5f9; opacity: 0; }
#end1 { font: 700 calc(var(--u) * 13) InterD; letter-spacing: -0.02em; }
#end2 { font: 500 calc(var(--u) * 3.6) InterM; color: #00f2ff; letter-spacing: .04em; }
#end3 { font: 300 calc(var(--u) * 2.6) InterL; color: #94a3b8; letter-spacing: .3em; }
#shade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head><body>
<div id="shade"></div>
<div id="end1" class="ov">AmF X1</div>
<div id="end2" class="ov">by AMFB Audio</div>
<div id="end3" class="ov">THE PRO CONSOLE · BUILT SMART</div>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { Reflector } from "three/addons/objects/Reflector.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const Q = new URLSearchParams(location.search);
const W = Number(Q.get("w") || 3840), H = Number(Q.get("h") || 2160), FPS = Number(Q.get("fps") || 60);
document.body.style.width = W + "px"; document.body.style.height = H + "px"; document.body.style.setProperty("--u", (H / 100) + "px");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lin = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, easeOut = (x) => 1 - Math.pow(1 - x, 3);
const mix = (a, b, k) => a + (b - a) * k;

// ---------- the screen's footage: the console, captured live, and its cursor ----------
const CLIPS = await (await fetch("/cap/clips.json")).json();   // [{name, frames, cursor: [[x, y, down], ...], w, h}]
let total = 0; for (const c of CLIPS) { c.start = total; total += c.frames; }
const SW = 3200, SH = 2000;
const scr = document.createElement("canvas"); scr.width = SW; scr.height = SH; const sg = scr.getContext("2d");
const screenTex = new THREE.CanvasTexture(scr); screenTex.colorSpace = THREE.SRGBColorSpace; screenTex.anisotropy = 16;
function img(src) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
function drawCursor(x, y, down, s) {
  sg.save(); sg.translate(x, y); sg.scale(s, s);
  if (down) { sg.beginPath(); sg.arc(0, 0, 22, 0, Math.PI * 2); sg.fillStyle = "rgba(0,242,255,0.22)"; sg.fill(); sg.lineWidth = 2.5; sg.strokeStyle = "rgba(0,242,255,0.85)"; sg.stroke(); }
  sg.beginPath(); sg.moveTo(0, 0); sg.lineTo(0, 34); sg.lineTo(8.5, 26); sg.lineTo(14.5, 39.5); sg.lineTo(20, 37); sg.lineTo(14, 24); sg.lineTo(25, 24); sg.closePath();
  sg.shadowColor = "rgba(0,0,0,0.55)"; sg.shadowBlur = 8; sg.shadowOffsetY = 3; sg.fillStyle = "#ffffff"; sg.fill();
  sg.shadowColor = "transparent"; sg.lineWidth = 2.2; sg.strokeStyle = "#0b0d12"; sg.stroke(); sg.restore();
}
async function screenAt(f) {
  f = Math.min(f, total - 1); let c = CLIPS[0]; for (const k of CLIPS) if (f >= k.start) c = k;
  const i = f - c.start, im = await img(`/cap/${c.name}/f${String(i).padStart(4, "0")}.png`);
  sg.drawImage(im, 0, 0, SW, SH);
  const cu = c.cursor[Math.min(i, c.cursor.length - 1)], k = SW / c.w;
  if (cu) drawCursor(cu[0] * k, cu[1] * k, cu[2] === 1, k * 0.95);
  screenTex.needsUpdate = true;
}

// ---------- renderer, scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.domElement.id = "gl";
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
RectAreaLightUniformsLib.init();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x030405); scene.fog = new THREE.Fog(0x030405, 9, 22);
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.22;
const camera = new THREE.PerspectiveCamera(32, W / H, 0.02, 100);

// the desk: a dark, satin top with a soft mirror
const mirror = new Reflector(new THREE.PlaneGeometry(40, 40), { textureWidth: W / 3, textureHeight: H / 3, color: 0x4a4f58 });
mirror.rotation.x = -Math.PI / 2; scene.add(mirror);
const deskTop = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x0b0c0f, roughness: 0.55, metalness: 0.1, transparent: true, opacity: 0.88 }));
deskTop.rotation.x = -Math.PI / 2; deskTop.position.y = 0.002; deskTop.receiveShadow = true; scene.add(deskTop);
// the back wall: a dark gradient
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 14), new THREE.ShaderMaterial({ uniforms: {}, vertexShader: "varying vec2 v; void main(){ v = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }",
  fragmentShader: "varying vec2 v; void main(){ float g = smoothstep(0.0, 0.7, v.y); vec3 a = vec3(0.012,0.016,0.024), b = vec3(0.03,0.035,0.05); float r = exp(-pow((v.x-0.5)*3.0,2.0)); gl_FragColor = vec4(mix(a,b,g*r),1.); }" }));
wall.position.set(0, 7, -9); scene.add(wall);
// bokeh lights far behind (they blur into discs)
const bokeh = [];
for (let i = 0; i < 14; ++i) {
  const warm = i % 3 !== 0, s = new THREE.Mesh(new THREE.SphereGeometry(0.05 + (i % 4) * 0.02, 12, 12), new THREE.MeshBasicMaterial({ color: warm ? 0x8a5a20 : 0x24507f }));
  const a = (i * 2.399) % 6.28; s.position.set(Math.cos(a) * (2.5 + (i % 5) * 1.5), 1.6 + ((i * 7) % 11) * 0.36, -8.2 - (i % 4) * 0.5); scene.add(s); bokeh.push(s);
}
// studio monitors left and right, in the dark
function monitor(x) {
  const g = new THREE.Group();
  const box = new THREE.Mesh(new RoundedBoxGeometry(0.85, 1.35, 0.9, 4, 0.06), new THREE.MeshStandardMaterial({ color: 0x0d0f13, roughness: 0.6, metalness: 0.2 })); box.castShadow = true; g.add(box);
  const coneMat = new THREE.MeshStandardMaterial({ color: 0x111318, roughness: 0.35, metalness: 0.4 });
  const woofer = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.04, 48), coneMat); woofer.rotation.x = Math.PI / 2; woofer.position.set(0, -0.2, 0.46); g.add(woofer);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.29, 0.018, 12, 64), new THREE.MeshStandardMaterial({ color: 0x23262d, metalness: 0.8, roughness: 0.3 })); ring.position.set(0, -0.2, 0.47); g.add(ring);
  const tw = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.014, 12, 48), ring.material); tw.position.set(0, 0.33, 0.47); g.add(tw);
  const led = new THREE.Mesh(new THREE.CircleGeometry(0.015, 16), new THREE.MeshBasicMaterial({ color: 0x00f2ff })); led.position.set(0, -0.56, 0.452); g.add(led);
  g.position.set(x, 0.675, -2.9); g.rotation.y = -x * 0.09; scene.add(g); return g;
}
monitor(-3.1); monitor(3.1);

// ---------- the laptop ----------
const alu = new THREE.MeshStandardMaterial({ color: 0x1f2227, roughness: 0.34, metalness: 0.92 });
const laptop = new THREE.Group(); scene.add(laptop);
const BW = 3.1, BD = 2.12, BH = 0.075;
const base = new THREE.Mesh(new RoundedBoxGeometry(BW, BH, BD, 6, 0.035), alu); base.position.y = BH / 2; base.castShadow = true; laptop.add(base);
// keyboard: instanced keys in a recessed well
const well = new THREE.Mesh(new RoundedBoxGeometry(2.62, 0.01, 1.02, 3, 0.004), new THREE.MeshStandardMaterial({ color: 0x0c0d10, roughness: 0.8 }));
well.position.set(0, BH + 0.001, -0.33); laptop.add(well);
const keyGeo = new RoundedBoxGeometry(0.158, 0.022, 0.148, 3, 0.02), keyMat = new THREE.MeshStandardMaterial({ color: 0x0a0b0d, roughness: 0.7, metalness: 0.05 });
const rows = [14, 14, 14, 13, 12, 9], keys = new THREE.InstancedMesh(keyGeo, keyMat, rows.reduce((a, b) => a + b, 0)); let ki = 0; const m4 = new THREE.Matrix4();
rows.forEach((n, r) => { for (let c = 0; c < n; ++c) { const w = r === 5 && c === 4 ? 4.2 : 1; const x = -1.235 + (c + (14 - n) * 0.5) * 0.1765 + (w - 1) * 0.08; m4.makeScale(w, 1, 1); m4.setPosition(x, BH + 0.012, -0.78 + r * 0.168); keys.setMatrixAt(ki++, m4); } });
laptop.add(keys);
const glowKeys = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.0), new THREE.MeshBasicMaterial({ color: 0x4fd8ff, transparent: true, opacity: 0.018, blending: THREE.AdditiveBlending, depthWrite: false }));
glowKeys.rotation.x = -Math.PI / 2; glowKeys.position.set(0, BH + 0.004, -0.33); laptop.add(glowKeys);
const pad = new THREE.Mesh(new RoundedBoxGeometry(1.18, 0.004, 0.72, 3, 0.002), new THREE.MeshStandardMaterial({ color: 0x23272e, roughness: 0.35, metalness: 0.6 }));
pad.position.set(0, BH + 0.001, 0.58); laptop.add(pad);
// the lid, opened ~108°
const lid = new THREE.Group(); lid.position.set(0, BH, -BD / 2 + 0.03); lid.rotation.x = -0.32; laptop.add(lid);
const LH = 2.0, LT = 0.032;
const lidShell = new THREE.Mesh(new RoundedBoxGeometry(BW, LH, LT, 6, 0.016), alu); lidShell.position.set(0, LH / 2, -LT / 2); lidShell.castShadow = true; lid.add(lidShell);
const bezel = new THREE.Mesh(new THREE.PlaneGeometry(BW - 0.04, LH - 0.04), new THREE.MeshStandardMaterial({ color: 0x050506, roughness: 0.15, metalness: 0.3 }));
bezel.position.set(0, LH / 2, 0.0015); lid.add(bezel);
const SCW = 2.94, SCH = SCW * 10 / 16;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(SCW, SCH), new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false, color: 0xe6e6e6 }));
screen.position.set(0, LH / 2 + 0.03, 0.003); lid.add(screen);
const glass = new THREE.Mesh(new THREE.PlaneGeometry(BW - 0.04, LH - 0.04), new THREE.MeshPhysicalMaterial({ color: 0x000000, roughness: 0.05, metalness: 0, transparent: true, opacity: 0.1, clearcoat: 1, clearcoatRoughness: 0.03 }));
glass.position.set(0, LH / 2, 0.0045);   // (not added: it mirrored the screen light as a bright square in close-ups)
const cam = new THREE.Mesh(new THREE.CircleGeometry(0.012, 16), new THREE.MeshBasicMaterial({ color: 0x15171c })); cam.position.set(0, LH - 0.012, 0.0035); lid.add(cam);
// the screen's light on the keys and the desk
const spill = new THREE.RectAreaLight(0xbfe9ff, 1.3, SCW, SCH); spill.position.copy(screen.position); spill.position.z += 0.02; spill.lookAt(0, LH / 2 + 0.03, 3); lid.add(spill);

// ---------- light: blue and amber rims, a soft key ----------
scene.add(new THREE.AmbientLight(0x8090a0, 0.06));
const rimB = new THREE.SpotLight(0x3b82f6, 160, 18, 0.42, 0.65, 1.6); rimB.position.set(-4.6, 4.2, -4.4); rimB.target = laptop; rimB.castShadow = true; scene.add(rimB);
const rimA = new THREE.SpotLight(0xf59e0b, 120, 18, 0.42, 0.65, 1.6); rimA.position.set(4.8, 3.6, -3.8); rimA.target = laptop; scene.add(rimA);
const key = new THREE.SpotLight(0xffffff, 26, 16, 0.5, 0.9, 1.4); key.position.set(1.5, 5.2, 4.5); key.target = laptop; key.castShadow = true; key.shadow.mapSize.set(2048, 2048); scene.add(key);
const edgeB = new THREE.PointLight(0x3b82f6, 6, 6, 2); edgeB.position.set(-2.2, 0.35, -1.4); scene.add(edgeB);
const edgeA = new THREE.PointLight(0xf59e0b, 5, 6, 2); edgeA.position.set(2.3, 0.4, -1.2); scene.add(edgeA);

// ---------- post: bloom, depth of field ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.35, 0.6, 0.82); composer.addPass(bloom);
const bokehPass = new BokehPass(scene, camera, { focus: 6, aperture: 0.004, maxblur: 0.012 }); composer.addPass(bokehPass);
composer.addPass(new OutputPass());

// ---------- the shot: one continuous macro push-in ----------
const screenWorld = () => { const v = new THREE.Vector3(); screen.getWorldPosition(v); return v; };
window.renderAt = async (frame) => {
  const t = frame / FPS, T = total / FPS;   // the footage length (20 s); the end card follows
  await screenAt(Math.round(t * FPS));
  const k = ease(lin(t, 0, T)), sc = screenWorld();
  // from a wide three-quarter view to a macro view of the screen's left half (the faders), then centre for the plug-in
  const start = new THREE.Vector3(4.3, 2.3, 4.9), mid = new THREE.Vector3(1.8, 1.65, 3.0), end = new THREE.Vector3(-0.15, 1.18, 0.75);
  const a = 1 - k, pos = start.clone().multiplyScalar(a * a).add(mid.clone().multiplyScalar(2 * a * k)).add(end.clone().multiplyScalar(k * k));
  pos.x += Math.sin(t * 0.37) * 0.025; pos.y += Math.sin(t * 0.53) * 0.015;   // a breath of handheld
  const look = sc.clone().add(new THREE.Vector3(mix(0.1, -0.35, ease(lin(t, 4, 9))) + mix(0, 0.38, ease(lin(t, 13.5, 15.5))), mix(-0.25, -0.05, k), 0));
  camera.position.copy(pos); camera.lookAt(look);
  camera.fov = mix(32, 26, k); camera.updateProjectionMatrix();
  bokehPass.uniforms.focus.value = pos.distanceTo(look);
  bokehPass.uniforms.aperture.value = mix(0.0016, 0.0062, k);
  bokehPass.uniforms.maxblur.value = mix(0.006, 0.014, k);
  for (let i = 0; i < bokeh.length; ++i) bokeh[i].scale.setScalar(0.8 + 0.25 * Math.sin(t * 0.8 + i));
  composer.render();
  // the end card
  const e = lin(t, T + 0.1, T + 1.1);
  document.getElementById("shade").style.opacity = (0.82 * ease(e) + 0.18 * lin(t, T + 3.2, T + 4)).toFixed(3);
  const card = (id, a, top, dy) => { const el = document.getElementById(id); el.style.opacity = a.toFixed(3); el.style.top = top; el.style.transform = `translateY(${(dy).toFixed(1)}px)`; };
  const fadeOut = 1 - lin(t, T + 3.2, T + 4.0);
  card("end1", easeOut(lin(t, T + 0.5, T + 1.3)) * fadeOut, "38%", (1 - easeOut(lin(t, T + 0.5, T + 1.3))) * H * 0.02);
  card("end2", easeOut(lin(t, T + 0.9, T + 1.6)) * fadeOut, "55%", (1 - easeOut(lin(t, T + 0.9, T + 1.6))) * H * 0.015);
  card("end3", easeOut(lin(t, T + 1.3, T + 2.0)) * fadeOut, "62%", 0);
  return true;
};
await document.fonts.ready;
window.totalFrames = total + FPS * 4;
window.ready = true;
</script></body></html>
