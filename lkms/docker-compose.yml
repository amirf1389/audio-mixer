# The database is on a private network and is not published to the host. Only the API port is, on localhost,
# for your TLS reverse proxy (Caddy, nginx) to forward to.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lkms
      POSTGRES_DB: lkms
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - lkms-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks: [inside]
    restart: unless-stopped
  api:
    build: .
    env_file: .env            # LKMS_DATABASE_URL=postgresql://lkms:<password>@db:5432/lkms and the three secrets
    depends_on: [db]
    ports: ["127.0.0.1:8088:8088"]
    networks: [inside]
    restart: unless-stopped
secrets:
  db_password:
    file: ./db_password.txt   # one line, not in git
volumes:
  lkms-data:
networks:
  inside:
