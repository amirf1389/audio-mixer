<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmF X1 · Customers</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand bg-body border-bottom px-3">
  <span class="navbar-brand fw-bold"><span class="text-warning">AmF</span> X1 · CRM</span>
  <div class="navbar-nav me-auto">
    <a class="nav-link" href="./"><i class="fa-solid fa-key me-1" aria-hidden="true"></i>Licence keys</a>
    <a class="nav-link active" aria-current="page" href="./crm"><i class="fa-solid fa-address-book me-1" aria-hidden="true"></i>Customers</a>
    <a class="nav-link" href="#staff" id="staffTab"><i class="fa-solid fa-users-gear me-1" aria-hidden="true"></i>Staff</a>
    <a class="nav-link" href="./system"><i class="fa-solid fa-gears me-1" aria-hidden="true"></i>System</a>
  </div>
  <span id="who" class="text-secondary small me-3"></span>
  <button id="out" class="btn btn-outline-secondary btn-sm" type="button"><i class="fa-solid fa-right-from-bracket me-1" aria-hidden="true"></i>Sign out</button>
</nav>

<main class="container-fluid py-3">
  <div id="alert" class="alert d-none" role="alert"></div>
  <div class="row g-3 mb-3" id="stats"></div>

  <section id="custSec">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
      <h1 class="h5 mb-0 me-auto">Customers</h1>
      <input id="q" class="form-control form-control-sm w-auto" type="search" placeholder="Search name, e-mail, company" aria-label="Search">
      <select id="fStatus" class="form-select form-select-sm w-auto" aria-label="Status filter"><option value="">All statuses</option></select>
      <button id="newBtn" class="btn btn-warning btn-sm" type="button"><i class="fa-solid fa-plus me-1" aria-hidden="true"></i>New customer</button>
    </div>
    <div class="table-responsive bg-body rounded border">
      <table class="table table-hover table-sm align-middle mb-0">
        <thead><tr><th>Name</th><th>Company</th><th>E-mail</th><th>Phone</th><th>Status</th><th>Updated</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section id="staffSec" class="d-none">
    <div class="d-flex align-items-center mb-2"><h1 class="h5 mb-0 me-auto">Staff accounts</h1></div>
    <div class="row g-3">
      <div class="col-lg-7"><div class="table-responsive bg-body rounded border"><table class="table table-sm align-middle mb-0">
        <thead><tr><th>Name</th><th>E-mail</th><th>Last sign-in</th><th>State</th><th></th></tr></thead><tbody id="staffRows"></tbody></table></div></div>
      <div class="col-lg-5"><form id="staffForm" class="bg-body rounded border p-3" novalidate>
        <h2 class="h6">Add a staff account</h2>
        <div class="mb-2"><label class="form-label small" for="sName">Name</label><input id="sName" class="form-control form-control-sm" required maxlength="80"></div>
        <div class="mb-2"><label class="form-label small" for="sEmail">E-mail</label><input id="sEmail" type="email" class="form-control form-control-sm" required></div>
        <div class="mb-2"><label class="form-label small" for="sPw">Password (12+ characters)</label><input id="sPw" type="password" autocomplete="new-password" class="form-control form-control-sm" required minlength="12"></div>
        <button class="btn btn-warning btn-sm" type="submit">Add</button>
        <p class="small text-secondary mt-2 mb-0">Every staff account can edit everything. Disable an account to end its sessions at once.</p>
      </form></div>
    </div>
  </section>
</main>

<div class="modal fade" id="custModal" tabindex="-1" aria-labelledby="custTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title h5" id="custTitle">Customer</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body">
      <form id="custForm" class="row g-2" novalidate>
        <div class="col-md-6"><label class="form-label small" for="cName">Name</label><input id="cName" class="form-control form-control-sm" required maxlength="120"></div>
        <div class="col-md-6"><label class="form-label small" for="cCompany">Company</label><input id="cCompany" class="form-control form-control-sm" maxlength="120"></div>
        <div class="col-md-6"><label class="form-label small" for="cEmail">E-mail</label><input id="cEmail" type="email" class="form-control form-control-sm" maxlength="254"></div>
        <div class="col-md-6"><label class="form-label small" for="cPhone">Phone</label><input id="cPhone" class="form-control form-control-sm" maxlength="40"></div>
        <div class="col-md-4"><label class="form-label small" for="cCountry">Country</label><input id="cCountry" class="form-control form-control-sm" maxlength="60"></div>
        <div class="col-md-4"><label class="form-label small" for="cStatus">Status</label><select id="cStatus" class="form-select form-select-sm"></select></div>
        <div class="col-md-4"><label class="form-label small" for="cTags">Tags</label><input id="cTags" class="form-control form-control-sm" maxlength="200"></div>
      </form>
      <div id="noteBox" class="mt-3 d-none">
        <h3 class="h6">Notes</h3>
        <div class="input-group input-group-sm mb-2"><input id="noteText" class="form-control" maxlength="4000" placeholder="Call, e-mail, order…" aria-label="New note"><button id="noteAdd" class="btn btn-outline-warning" type="button">Add note</button></div>
        <ul id="notes" class="list-group list-group-flush small"></ul>
      </div>
    </div>
    <div class="modal-footer">
      <button id="delBtn" type="button" class="btn btn-outline-danger btn-sm me-auto d-none"><i class="fa-solid fa-trash me-1" aria-hidden="true"></i>Delete</button>
      <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
      <button id="saveBtn" type="button" class="btn btn-warning btn-sm">Save</button>
    </div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="crm.js"></script>
</body>
</html>
