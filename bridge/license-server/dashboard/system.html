<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmF X1 · System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand bg-body border-bottom px-3">
  <span class="navbar-brand fw-bold"><span class="text-warning">AmF</span> X1 · System</span>
  <div class="navbar-nav me-auto">
    <a class="nav-link" href="./"><i class="fa-solid fa-key me-1" aria-hidden="true"></i>Licence keys</a>
    <a class="nav-link" href="./crm"><i class="fa-solid fa-address-book me-1" aria-hidden="true"></i>Customers</a>
    <a class="nav-link active" aria-current="page" href="./system"><i class="fa-solid fa-gears me-1" aria-hidden="true"></i>System</a>
  </div>
  <span id="who" class="text-secondary small me-3"></span>
  <button id="out" class="btn btn-outline-secondary btn-sm" type="button"><i class="fa-solid fa-right-from-bracket me-1" aria-hidden="true"></i>Sign out</button>
</nav>

<main class="container-fluid py-3">
  <div id="alert" class="alert d-none" role="alert"></div>
  <ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tOverview" type="button" role="tab" aria-controls="tOverview" aria-selected="true"><i class="fa-solid fa-gauge me-1" aria-hidden="true"></i>Overview</button></li>
    <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tSettings" type="button" role="tab" aria-controls="tSettings" aria-selected="false"><i class="fa-solid fa-sliders me-1" aria-hidden="true"></i>Settings</button></li>
    <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tStaff" type="button" role="tab" aria-controls="tStaff" aria-selected="false" id="staffTabBtn"><i class="fa-solid fa-users-gear me-1" aria-hidden="true"></i>Staff &amp; sessions</button></li>
    <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tAudit" type="button" role="tab" aria-controls="tAudit" aria-selected="false" id="auditTabBtn"><i class="fa-solid fa-list-check me-1" aria-hidden="true"></i>Activity</button></li>
  </ul>

  <div class="tab-content">
    <section class="tab-pane fade show active" id="tOverview" role="tabpanel">
      <div class="d-flex mb-2"><h1 class="h5 me-auto mb-0">Health</h1><button id="backup" class="btn btn-outline-secondary btn-sm me-2" type="button"><i class="fa-solid fa-database me-1" aria-hidden="true"></i>Back up the database</button><button id="refresh" class="btn btn-outline-warning btn-sm" type="button"><i class="fa-solid fa-rotate me-1" aria-hidden="true"></i>Refresh</button></div>
      <div class="row g-3 mb-3" id="cards"></div>
      <div class="row g-3">
        <div class="col-lg-6"><div class="bg-body border rounded p-3"><h2 class="h6">Server</h2><dl class="row small mb-0" id="srv"></dl></div></div>
        <div class="col-lg-6"><div class="bg-body border rounded p-3"><h2 class="h6">Configuration <span class="text-secondary fw-normal">(no secret is ever shown)</span></h2><dl class="row small mb-0" id="cfg"></dl></div></div>
      </div>
    </section>

    <section class="tab-pane fade" id="tSettings" role="tabpanel">
      <form id="setForm" class="bg-body border rounded p-3" novalidate>
        <div class="row g-3" id="setFields"></div>
        <div class="d-flex gap-2 mt-3 align-items-center">
          <button class="btn btn-warning btn-sm" type="submit"><i class="fa-solid fa-floppy-disk me-1" aria-hidden="true"></i>Save settings</button>
          <button id="setReset" class="btn btn-outline-secondary btn-sm" type="button">Undo changes</button>
          <span id="setNote" class="small text-secondary"></span>
        </div>
      </form>
    </section>

    <section class="tab-pane fade" id="tStaff" role="tabpanel">
      <div class="row g-3">
        <div class="col-lg-8"><div class="table-responsive bg-body rounded border"><table class="table table-sm align-middle mb-0">
          <thead><tr><th>Name</th><th>E-mail</th><th>Last sign-in</th><th>State</th><th class="text-end">Actions</th></tr></thead><tbody id="staffRows"></tbody></table></div></div>
        <div class="col-lg-4">
          <form id="staffForm" class="bg-body rounded border p-3 mb-3" novalidate>
            <h2 class="h6">Add a staff account</h2>
            <div class="mb-2"><label class="form-label small" for="sName">Name</label><input id="sName" class="form-control form-control-sm" maxlength="80"></div>
            <div class="mb-2"><label class="form-label small" for="sEmail">E-mail</label><input id="sEmail" type="email" class="form-control form-control-sm"></div>
            <div class="mb-2"><label class="form-label small" for="sPw">Password (12+ characters)</label><input id="sPw" type="password" autocomplete="new-password" class="form-control form-control-sm" minlength="12"></div>
            <button class="btn btn-warning btn-sm" type="submit">Add</button>
          </form>
          <form id="pwForm" class="bg-body rounded border p-3" novalidate>
            <h2 class="h6">Change my password</h2>
            <div class="mb-2"><label class="form-label small" for="pCur">Current password</label><input id="pCur" type="password" autocomplete="current-password" class="form-control form-control-sm"></div>
            <div class="mb-2"><label class="form-label small" for="pNew">New password (12+ characters)</label><input id="pNew" type="password" autocomplete="new-password" class="form-control form-control-sm" minlength="12"></div>
            <button class="btn btn-outline-warning btn-sm" type="submit">Change</button>
            <p class="small text-secondary mt-2 mb-0">Changing it signs you out everywhere, this tab too.</p>
          </form>
        </div>
      </div>
    </section>

    <section class="tab-pane fade" id="tAudit" role="tabpanel">
      <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
        <h1 class="h5 mb-0 me-auto">Activity</h1>
        <input id="aFilter" class="form-control form-control-sm w-auto" type="search" placeholder="Filter: action, id, address" aria-label="Filter the activity">
        <select id="aLimit" class="form-select form-select-sm w-auto" aria-label="How many"><option>100</option><option>250</option><option>500</option></select>
        <button id="aVerify" class="btn btn-outline-warning btn-sm" type="button"><i class="fa-solid fa-link me-1" aria-hidden="true"></i>Check the chain</button>
        <a class="btn btn-outline-secondary btn-sm" href="crm/export.csv" id="csv"><i class="fa-solid fa-file-csv me-1" aria-hidden="true"></i>Customers as CSV</a>
      </div>
      <div class="table-responsive bg-body rounded border"><table class="table table-sm table-striped align-middle mb-0 small">
        <thead><tr><th>When</th><th>Action</th><th>Record</th><th>Address</th><th>Detail</th></tr></thead><tbody id="auditRows"></tbody></table></div>
    </section>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="system.js"></script>
</body>
</html>
