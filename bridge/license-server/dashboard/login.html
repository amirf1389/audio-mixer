<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmF X1 · Staff sign-in</title>
<!-- Tailwind Play CDN, pinned to 3.4.16. Its host sends no CORS header, so the browser cannot check an integrity hash for it: the CSP allows only this host. -->
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
<main class="w-full max-w-sm">
  <div class="mb-6 text-center">
    <div class="text-2xl font-bold tracking-widest"><span class="text-amber-400">AmF</span> X1</div>
    <p class="text-slate-400 text-sm mt-1">Vendor portal · licences, updates, customers</p>
  </div>
  <form id="f" class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4 shadow-xl" novalidate>
    <h1 class="text-lg font-semibold"><i class="fa-solid fa-user-lock text-amber-400 mr-2" aria-hidden="true"></i>Staff sign-in</h1>
    <label class="block text-sm">E-mail
      <input id="email" type="email" autocomplete="username" required class="mt-1 w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
    </label>
    <label class="block text-sm">Password
      <input id="pw" type="password" autocomplete="current-password" required minlength="12" class="mt-1 w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
    </label>
    <label class="block text-sm">Open
      <select id="go" class="mt-1 w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2">
        <option value="./">Licence keys</option>
        <option value="./crm">Customers (CRM)</option>
        <option value="./system">System</option>
      </select>
    </label>
    <button class="w-full rounded-md bg-amber-400 text-slate-950 font-semibold py-2 hover:bg-amber-300 focus:outline-none focus:ring-2 focus:ring-amber-200"><i class="fa-solid fa-right-to-bracket mr-2" aria-hidden="true"></i>Sign in</button>
    <p id="msg" role="alert" class="text-sm text-rose-400 min-h-[1.25rem]"></p>
    <p class="text-xs text-slate-500">The session lasts 8 hours and only in this tab. Every staff account can edit licences, releases and customers.</p>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>
