# nginx in front of the AmF X1 licence server (bridge/license-server). The app and the customer portal reach the server only through this.
#
#   internet --https--> nginx (this file) --http on 127.0.0.1--> licence server (LICENSE_HOST=127.0.0.1, LICENSE_PORT=8787)
#
# What is open:   POST /redeem /status /activate /deactivate   the four calls the app makes
#                 GET  /portal/...                               the customer page (product key, key check, updates)
#                 GET  /health                                   for monitoring
# What is closed: everything else, and above all /admin and /issue. Management is reached on the server itself or through an SSH tunnel
#                 (ssh -L 8787:127.0.0.1:8787 you@server, then http://127.0.0.1:8787/admin/); it is never published.
#
# Start the licence server with LICENSE_TRUST_PROXY=1 so that its own limits count the real caller (nginx sets X-Forwarded-For below and
# overwrites whatever the caller sent). Replace licence.amirfakhribadri.my and the two certificate paths; `nginx -t` checks the file.

limit_req_zone  $binary_remote_addr zone=lic_api:10m  rate=30r/m;    # the four calls: one every two seconds per address
limit_req_zone  $binary_remote_addr zone=lic_page:10m rate=10r/s;    # the portal's page and files
limit_conn_zone $binary_remote_addr zone=lic_conn:10m;

server {                                   # plain http only sends people to https
  listen 80; listen [::]:80;
  server_name licence.amirfakhribadri.my;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2; listen [::]:443 ssl http2;
  server_name licence.amirfakhribadri.my;

  ssl_certificate     /etc/letsencrypt/live/licence.amirfakhribadri.my/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/licence.amirfakhribadri.my/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:lic_tls:10m; ssl_session_timeout 1d; ssl_session_tickets off;

  server_tokens off;
  client_max_body_size 8k;                 # a request here is a product key or a licence key: nothing larger is taken
  client_body_timeout 10s; client_header_timeout 10s; send_timeout 15s; keepalive_timeout 20s;
  limit_conn lic_conn 10; limit_req_status 429; limit_conn_status 429;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-For   $remote_addr;      # set, not appended: a caller cannot name an address of its own
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  proxy_connect_timeout 5s; proxy_read_timeout 20s; proxy_send_timeout 10s;
  proxy_hide_header X-Powered-By;

  # the four calls of the app: POST only, a small body, a slow rate
  location ~ ^/(redeem|status|activate|deactivate)$ {
    limit_except POST { deny all; }
    limit_req zone=lic_api burst=10 nodelay;
    proxy_pass http://127.0.0.1:8787;
  }

  # the customer portal: GET only
  location = /portal { return 301 /portal/; }
  location /portal/ {
    limit_except GET { deny all; }
    limit_req zone=lic_page burst=40 nodelay;
    proxy_pass http://127.0.0.1:8787;
  }

  location = /health { limit_except GET { deny all; } proxy_pass http://127.0.0.1:8787; access_log off; }
  location = /       { return 302 /portal/; }

  # management and everything not named above: not here
  location / { return 404; }
}
