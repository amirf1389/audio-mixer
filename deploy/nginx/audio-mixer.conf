# nginx front end for the Audio Mixer page + local bridge.
# Install: copy to /etc/nginx/conf.d/audio-mixer.conf (or sites-available), edit the CHANGE ME lines, `nginx -t && nginx -s reload`.
#
# Design: nginx serves ONLY the mixer page itself. The bridge (/api, /ws) reads this machine's audio
# drivers and plays audio on this machine's interface, so it is proxied to loopback only and
# refused for everyone else. Widen the `allow` lines to trust a LAN, never the open internet.

limit_req_zone $binary_remote_addr zone=mixer_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mixer_conn:10m;

map $http_upgrade $mixer_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mixer_bridge {
    server 127.0.0.1:8765;          # BRIDGE_PORT
    keepalive 8;
}

# Plain HTTP: redirect to HTTPS (remove this block for localhost-only use)
server {
    listen 80;
    listen [::]:80;
    server_name mixer.example.com;  # CHANGE ME
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;          # on nginx >= 1.25.1 you may use `listen 443 ssl;` + `http2 on;` instead
    listen [::]:443 ssl http2;
    server_name mixer.example.com;  # CHANGE ME

    ssl_certificate     /etc/letsencrypt/live/mixer.example.com/fullchain.pem;  # CHANGE ME
    ssl_certificate_key /etc/letsencrypt/live/mixer.example.com/privkey.pem;    # CHANGE ME
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mixer_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn mixer_conn 40;

    # The mixer needs mic, USB and Bluetooth from its own origin (WebUSB / Web Bluetooth / getUserMedia).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), usb=(self), bluetooth=(self), camera=(), geolocation=()" always;

    root /srv/audio-mixer;          # CHANGE ME: the repo checkout (only the page is exposed, see below)
    index gemini-code-1790419147591.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Never expose dotfiles, repo metadata, bridge sources or deploy files.
    location ~ /\. { deny all; return 404; }
    location ~ ^/(bridge|deploy|\.github|\.vscode)(/|$) { return 404; }
    location ~* \.(md|yml|yaml|conf|json|js)$ { return 404; }

    # The page itself. HTML is not cached so updates show immediately.
    location = / {
        try_files /gemini-code-1790419147591.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "microphone=(self), usb=(self), bluetooth=(self), camera=(), geolocation=()" always;
    }
    location = /gemini-code-1790419147591.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    location / { return 404; }

    # Bridge REST API: loopback only, basic auth, rate limited. Pass the browser's own Host/Origin through so the
    # bridge's DNS-rebinding / origin checks still apply (start it with BRIDGE_HOSTS and BRIDGE_ORIGINS, see README).
    location /api/ {
        allow 127.0.0.1;
        allow ::1;
        # allow 192.168.1.0/24;   # uncomment to trust your LAN
        deny all;
        # Basic auth in addition to the IP rule (both must pass). Create the file with:
        #   sudo sh -c 'echo "mixer:$(openssl passwd -apr1)" > /etc/nginx/.htpasswd_mixer'   (prompts for the password)
        satisfy all;
        auth_basic "Audio Mixer bridge";
        auth_basic_user_file /etc/nginx/.htpasswd_mixer;   # CHANGE ME if stored elsewhere
        proxy_set_header Authorization "";                 # do not forward credentials to the bridge

        limit_req zone=mixer_api burst=20 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://mixer_bridge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
        proxy_buffering off;
    }

    # Bridge WebSocket PCM output (ASIO / PortAudio): same restrictions, long-lived connection.
    location = /ws/output {
        allow 127.0.0.1;
        allow ::1;
        # allow 192.168.1.0/24;
        deny all;
        # Basic auth in addition to the IP rule (both must pass). Create the file with:
        #   sudo sh -c 'echo "mixer:$(openssl passwd -apr1)" > /etc/nginx/.htpasswd_mixer'   (prompts for the password)
        satisfy all;
        auth_basic "Audio Mixer bridge";
        auth_basic_user_file /etc/nginx/.htpasswd_mixer;   # CHANGE ME if stored elsewhere
        proxy_set_header Authorization "";                 # do not forward credentials to the bridge

        limit_req zone=mixer_api burst=5 nodelay;
        proxy_pass http://mixer_bridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mixer_connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;         # keep audio latency low
        tcp_nodelay on;
    }
}
