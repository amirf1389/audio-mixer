# fail2ban filter for the Audio Mixer nginx proxy (reads /var/log/nginx/audio-mixer.access.log).
# Matches: failed/blocked bridge requests (401 bad login, 403 not allowed, 429 rate limited)
# (fail2ban removes the timestamp before matching, hence the empty \[\]; `.*` tolerates spaces in the login name)
# and scanners probing for dotfiles / bridge sources / deploy files.
[Definition]
failregex = ^<HOST> \S+ .*\[\] "[A-Z]+ /(?:api|ws)/\S* HTTP/[\d.]+" (?:401|403|429)\s
            ^<HOST> \S+ .*\[\] "[A-Z]+ /(?:\.\S*|bridge/\S*|deploy/\S*) HTTP/[\d.]+" 404\s
ignoreregex =
