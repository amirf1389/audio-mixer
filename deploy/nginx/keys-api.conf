# nginx front end for the AmF X1 KEYS WEBSITE + the Key Generator's PUBLIC API (customers' key requests, OTA updates).
# Install: copy to /etc/nginx/conf.d/keys-api.conf, edit the CHANGE ME lines, get a certificate (certbot), `nginx -t && nginx -s reload`.
# Then start the generator so ONLY nginx can reach it (no router port 8780 any more; forward 443 and 80 instead):
#     "AmF X1 Key Generator.exe" --public 8780 --public-bind 127.0.0.1
#     node scripts/license-generator.js --public 8780 --public-bind 127.0.0.1
#
# Design: everything from the internet is HTTPS. nginx serves the static key page and forwards exactly four API routes
# to the generator on loopback; every other path is 404. The vendor page (keys, PIN, issuing) is NEVER proxied: it stays
# on http://localhost on the vendor's own computer. Request bodies are capped, rates limited per IP, slow clients cut off.

limit_req_zone  $binary_remote_addr zone=keys_api:10m  rate=5r/s;    # API
limit_req_zone  $binary_remote_addr zone=keys_req:10m  rate=6r/m;    # POST /request-license (generator adds 5/day per sender)
limit_req_zone  $binary_remote_addr zone=keys_page:10m rate=20r/s;   # website
limit_conn_zone $binary_remote_addr zone=keys_conn:10m;

upstream keygen_public {
    server 127.0.0.1:8780;          # the generator's --public port, bound with --public-bind 127.0.0.1
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name amirfakhri.interactivelink.site;   # CHANGE ME if the domain differs
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }   # certbot --webroot
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amirfakhri.interactivelink.site;   # CHANGE ME

    ssl_certificate     /etc/letsencrypt/live/amirfakhri.interactivelink.site/fullchain.pem;   # CHANGE ME
    ssl_certificate_key /etc/letsencrypt/live/amirfakhri.interactivelink.site/privkey.pem;     # CHANGE ME
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:keys_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;
    client_max_body_size 8k;          # a key request is < 1 KB
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;                  # large release downloads keep sending, idle ones are dropped
    limit_conn keys_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), bluetooth=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    root /srv/amfx1-website;           # CHANGE ME: a copy of deploy/website (the .html pages, assets/, sitemap.xml, robots.txt), nothing else
    error_page 404 /404.html;

    # the key page: https://<domain>/keys
    location = /keys  { limit_req zone=keys_page burst=40 nodelay; try_files /license.html =404;
                        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
                        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
                        add_header X-Content-Type-Options "nosniff" always;
                        add_header X-Frame-Options "DENY" always;
                        add_header Referrer-Policy "no-referrer" always;
                        add_header Cache-Control "no-cache" always; }

    # THE WEBSITE (scripts/build-website.js): static pages at clean URLs (/features -> features.html), no scripts, no third parties
    set $site_csp "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests";
    location = /      { limit_req zone=keys_page burst=40 nodelay; try_files /index.html =404; include /etc/nginx/amfx1-site-headers.inc; add_header Cache-Control "no-cache" always; }
    location = /404.html { internal; include /etc/nginx/amfx1-site-headers.inc; add_header Cache-Control "no-cache" always; }
    location ^~ /assets/ { limit_req zone=keys_page burst=80 nodelay; try_files $uri =404; include /etc/nginx/amfx1-site-headers.inc;
                           add_header Cache-Control "public, max-age=31536000, immutable" always; }      # versioned URLs (?v=<version>): safe to cache for a year
    location = /sitemap.xml { try_files /sitemap.xml =404; add_header Cache-Control "public, max-age=3600" always; add_header X-Content-Type-Options "nosniff" always; }
    location = /robots.txt  { try_files /robots.txt =404;  add_header Cache-Control "public, max-age=3600" always; add_header X-Content-Type-Options "nosniff" always; }
    location ~ ^/(features|download|developers|security|faq|privacy)$ { limit_req zone=keys_page burst=40 nodelay; try_files /$1.html =404;
                           include /etc/nginx/amfx1-site-headers.inc; add_header Cache-Control "no-cache" always; }
    location ~ \.html$ { return 301 /; }   # one URL per page (canonical): no .html duplicates

    # PUBLIC API -> the generator (loopback). Only these routes; X-Real-IP lets its per-sender limits see the customer.
    # /request-license: only for copies older than 1.22.1.0; the generator answers 410 (buy on WhatsApp) unless it runs with --accept-requests.
    location = /request-license {
        limit_req zone=keys_req burst=3 nodelay;
        limit_except POST OPTIONS { deny all; }
        include /etc/nginx/keys-api-proxy.inc;   # see below; or paste the proxy lines here
        proxy_pass http://keygen_public;
    }
    location = /update.json   { limit_req zone=keys_api burst=10 nodelay; limit_except GET { deny all; } include /etc/nginx/keys-api-proxy.inc; proxy_pass http://keygen_public; }
    location = /vendor.json   { limit_req zone=keys_api burst=10 nodelay; limit_except GET { deny all; } include /etc/nginx/keys-api-proxy.inc; proxy_pass http://keygen_public; }
    location ^~ /releases/    { limit_req zone=keys_api burst=10 nodelay; limit_except GET { deny all; } include /etc/nginx/keys-api-proxy.inc;
                                proxy_buffering off; proxy_pass http://keygen_public; }   # the include sets proxy_read_timeout 15s: that is per read, so a steady download is fine

    location ~ /\.  { return 404; }
    location /      { return 404; }    # nothing else exists here (no vendor page, no files, no listing)
}
