# nginx in front of the OTA server (TLS terminates here; the app only talks to https).
# Copy to /etc/nginx/conf.d/audio-mixer-ota.conf, edit server_name and the certificate paths, then: nginx -t && nginx -s reload
# Run the server with OTA_TRUST_PROXY=1 OTA_PUBLIC_URL=https://ota.example.com
limit_req_zone $binary_remote_addr zone=ota:10m rate=10r/s;
server {
  listen 443 ssl http2;
  server_name ota.example.com;
  ssl_certificate     /etc/letsencrypt/live/ota.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ota.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 450m;            # admin uploads (the app refuses files above 400 MB)
  proxy_request_buffering off;          # stream uploads to the server
  proxy_read_timeout 600s;
  location / {
    limit_req zone=ota burst=40 nodelay;
    proxy_pass http://127.0.0.1:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  # publish only from your own address (the token is required as well)
  # location /admin/ { allow 203.0.113.10; deny all; proxy_pass http://127.0.0.1:8780; proxy_set_header X-Forwarded-For $remote_addr; }
}
