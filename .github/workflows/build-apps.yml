# A mix OS: the native console (native/amixos, Qt 6 Quick on the C++20 engine in engine/cpp).
#   linux    builds the engine and the console with Ubuntu's Qt 6, runs the engine tests (vectors, dsp, runtime, stream, update_logic)
#            and the console's offscreen smoke test (interface loaded, null device running), and uploads the page screenshots
#   windows  builds the Windows x64 console with Qt 6 (MSVC) and the ASIO + WASAPI backends (the Steinberg ASIO SDK headers are in drivers/asio/sdk),
#            runs windeployqt and uploads amixos-windows-x64.zip: unzip anywhere and start amixos.exe. Not code-signed here (Windows shows "unknown publisher").
#   macos    builds the console with Qt 6 (clang, Core Audio backend), runs macdeployqt -dmg and uploads amixos-macos.dmg. Not notarised here:
#            right-click > Open the first time (or sign + notarise on your Mac with your Developer ID).
#   android  builds the Kotlin app (android/: local mixer + remote, the engine through the NDK): amixos-android.apk (debug-signed, installs anywhere) and
#            amixos-android.aab (debug-signed: re-sign with your upload key before Play, see android/README.md).
#            amixos-daemon on the PC; the full console on Android stays parked (roadmap).
# Runs on demand (workflow_dispatch), on pushes that touch the native code, and on version tags (v*), which also get a GitHub release.
# Only GitHub-owned actions (actions/*) are used: repositories that allow only those can run it; Qt comes from aqtinstall, the release from gh.
name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
    paths: [ "native/**", "engine/cpp/**", "drivers/asio/**", "android/**", "sdk/**", "bindings/**", ".github/workflows/build-apps.yml" ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Qt 6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libasound2-dev qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript libgl1-mesa-dev
      - name: Engine tests
        run: |
          cmake -S engine/cpp -B build/engine -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine
          ctest --test-dir build/engine --output-on-failure
      - name: Console (offscreen smoke test + screenshots)
        run: |
          cmake -S native/amixos -B build/amixos -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/amixos
          ctest --test-dir build/amixos --output-on-failure
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software build/amixos/amixos --shots build/shots
      - name: C SDK, Perl XS, Rust crates, WASM core, Linux tarball
        run: |
          sudo apt-get install -y perl clang lld
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal && . "$HOME/.cargo/env"
          (cd bindings/perl/Audio-AmixOS && AMIX_LIB=$PWD/../../../build/engine perl Makefile.PL && make && make test)
          (cd bindings/rust && AMIX_LIB_DIR=$PWD/../../build/engine LD_LIBRARY_PATH=$PWD/../../build/engine cargo test)
          sh sdk/wasm/build.sh && node sdk/wasm/test.mjs
          scripts/package-linux.sh build/engine
      - uses: actions/upload-artifact@v4
        with:
          name: amixos-linux-x64-${{ github.sha }}
          path: |
            build/amixos/amixos
            build/shots/*.png
            dist/amixos-*-linux-*.tar.gz
            dist/amixos-*-linux-*.tar.gz.sha256
            sdk/wasm/amix_dsp.wasm
          if-no-files-found: error
      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/amixos-*-linux-*.tar.gz dist/amixos-*-linux-*.tar.gz.sha256 || (sleep 30 && gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/amixos-*-linux-*.tar.gz dist/amixos-*-linux-*.tar.gz.sha256)

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt 6 (MSVC 2019 x64, via aqtinstall; no third-party action)
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.7.3 win64_msvc2019_64 -O C:\Qt
          "QT_ROOT_DIR=C:\Qt\6.7.3\msvc2019_64" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build the console
        shell: pwsh
        run: |
          cmake -S native/amixos -B build/amixos -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          cmake --build build/amixos --config Release --parallel
      - name: Engine tests (Windows)
        shell: pwsh
        run: |
          cmake -S engine/cpp -B build/engine -G "Visual Studio 17 2022" -A x64
          cmake --build build/engine --config Release --parallel
          ctest --test-dir build/engine -C Release --output-on-failure
      - name: Package (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/amixos-windows-x64 | Out-Null
          Copy-Item build/amixos/Release/amixos.exe dist/amixos-windows-x64/
          Copy-Item build/engine/Release/audiomixer-native.exe dist/amixos-windows-x64/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --qmldir native/amixos/qml --release --no-translations dist/amixos-windows-x64/amixos.exe
          Copy-Item native/amixos/README.md dist/amixos-windows-x64/README.md
          Compress-Archive -Path dist/amixos-windows-x64/* -DestinationPath dist/amixos-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: amixos-windows-x64-${{ github.sha }}
          path: dist/amixos-windows-x64.zip
          if-no-files-found: error
      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --title "A mix OS $env:GITHUB_REF_NAME" --notes "Windows x64 console: unzip and start amixos.exe" dist/amixos-windows-x64.zip 2>$null
          if ($LASTEXITCODE -ne 0) { gh release upload "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --clobber dist/amixos-windows-x64.zip }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt 6 (clang 64, via aqtinstall; no third-party action)
        run: |
          pip install aqtinstall
          aqt install-qt mac desktop 6.7.3 clang_64 -O "$HOME/Qt"
          echo "QT_ROOT_DIR=$HOME/Qt/6.7.3/macos" >> "$GITHUB_ENV"
      - name: Engine tests (macOS, Core Audio backend compiled)
        run: |
          cmake -S engine/cpp -B build/engine -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine --parallel
          ctest --test-dir build/engine --output-on-failure
      - name: Console + dmg (macdeployqt)
        run: |
          cmake -S native/amixos -B build/amixos -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build/amixos --parallel
          ls build/amixos
          APP=$(find build/amixos -maxdepth 2 -name "amixos.app" | head -1)
          if [ -z "$APP" ]; then mkdir -p build/amixos/amixos.app/Contents/MacOS && cp build/amixos/amixos build/amixos/amixos.app/Contents/MacOS/amixos && APP=build/amixos/amixos.app
            printf '<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0"><dict><key>CFBundleExecutable</key><string>amixos</string><key>CFBundleIdentifier</key><string>com.amfb.amixos</string><key>CFBundleName</key><string>A mix OS</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>0.1.0</string><key>NSMicrophoneUsageDescription</key><string>A mix OS reads your audio interface.</string></dict></plist>\n' > "$APP/Contents/Info.plist"; fi
          cp build/engine/audiomixer-native "$APP/Contents/MacOS/"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -qmldir=native/amixos/qml -dmg
          mkdir -p dist && mv "${APP%.app}.dmg" dist/amixos-macos.dmg
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: amixos-macos-${{ github.sha }}
          path: dist/amixos-macos.dmg
          if-no-files-found: error
      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/amixos-macos.dmg || (sleep 30 && gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/amixos-macos.dmg)

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (GitHub's runner image carries it; accept licences, install the platform Expo targets)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" >/dev/null
      - name: Native app (Kotlin + the engine's C SDK through the NDK)
        working-directory: android
        run: |
          sudo apt-get install -y kotlin && sh jvm-test/run.sh ../build/engine
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew --no-daemon assembleRelease bundleRelease -PallowDebugSigning=true   # CI test build: debug-signed, *-UNSIGNED-TEST (no release key here)
          cp app/build/outputs/apk/release/app-release*.apk ../dist/amixos-android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist/amixos-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: amixos-android-${{ github.sha }}
          path: |
            dist/amixos-android.apk
            dist/amixos-android.aab
          if-no-files-found: error
      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/amixos-android.apk dist/amixos-android.aab || (sleep 30 && gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist/amixos-android.apk dist/amixos-android.aab)
