# nginx in front of the hybrid mixer's control server (hybrid/node/server.js on 127.0.0.1:8377).
# Include this file inside the http { } block. Two doors:
#   1. HTTPS on the network (your own name and certificate)
#   2. a loopback-only door for an ngrok tunnel (ngrok does the TLS on its side)
# The control server itself never listens on the network.

limit_req_zone $binary_remote_addr zone=amfb_pair:1m rate=10r/m;   # PIN attempts
limit_req_zone $binary_remote_addr zone=amfb_api:1m rate=40r/s;    # meters and controls
limit_conn_zone $binary_remote_addr zone=amfb_conn:1m;

upstream amfb_hybrid { server 127.0.0.1:8377; keepalive 8; }

server {
    listen 443 ssl http2;
    server_name mixer.amirfakhribadri.my;                 # also put this name in AMFB_HOSTS for server.js

    ssl_certificate     /etc/letsencrypt/live/mixer.amirfakhribadri.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mixer.amirfakhribadri.my/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:amfb_tls:1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/amfb-hybrid-locations.conf;
}

server {
    listen 127.0.0.1:8378;                                # the ngrok agent on this machine connects here
    server_name _;
    set_real_ip_from 127.0.0.1;                           # the agent names the real caller
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/amfb-hybrid-locations.conf;
}

server {                                                  # plain HTTP only redirects
    listen 80;
    server_name mixer.amirfakhribadri.my;
    return 301 https://$host$request_uri;
}
