# Copy to /etc/nginx/snippets/amfb-hybrid-locations.conf (shared by both doors in nginx-hybrid.conf).
server_tokens off;
client_max_body_size 8k;
client_body_timeout 10s;
client_header_timeout 10s;
limit_conn amfb_conn 12;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;            # replaces whatever the caller sent
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 3s;
proxy_read_timeout 15s;

location = /api/pair {
    limit_req zone=amfb_pair burst=3 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    proxy_pass http://amfb_hybrid;
}
location /api/ {
    limit_req zone=amfb_api burst=80 nodelay;
    limit_req_status 429;
    limit_except GET POST { deny all; }
    proxy_pass http://amfb_hybrid;
}
location / {
    limit_except GET { deny all; }
    proxy_pass http://amfb_hybrid;
}
