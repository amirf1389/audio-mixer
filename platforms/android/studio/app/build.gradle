import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

// The repository root: platforms/android/studio/app -> ../../../..
def repoRoot = file('../../../..')
def androidDir = file('../..')
def generated = file('src/generated')

// Same version rules as scripts/build-apk.js: versionName from package.json, versionCode = major*10000 + minor*100 + patch.
def appVersion = new JsonSlurper().parse(new File(repoRoot, 'package.json')).version
def parts = appVersion.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
def appVersionCode = parts[0] * 10000 + (parts.size() > 1 ? parts[1] : 0) * 100 + (parts.size() > 2 ? parts[2] : 0)

android {
    namespace 'com.audiomixer.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.audiomixer.app'
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile new File(generated, 'AndroidManifest.xml')
            java.srcDirs = [new File(androidDir, 'src')]
            res.srcDirs = [new File(androidDir, 'res'), new File(generated, 'res')]
            assets.srcDirs = [new File(generated, 'assets')]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Page assets, launcher icons and the manifest copy are generated by the same code scripts/build-apk.js uses.
tasks.register('prepareAudioMixer', Exec) {
    workingDir repoRoot
    commandLine 'node', 'scripts/prepare-android-studio.js'
}
preBuild.dependsOn 'prepareAudioMixer'
